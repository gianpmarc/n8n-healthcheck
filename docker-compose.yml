# n8n-healthcheck web UI on http://localhost:8080. See docker/README.md.
name: n8n-healthcheck

services:
  healthcheck:
    build: .
    image: n8n-healthcheck:local
    # Localhost only: the UI has no authentication. Keep both port numbers the
    # same: the server only accepts requests whose Host header is
    # localhost:<its own port> or 127.0.0.1:<its own port>, and the browser
    # sends the published port. With 8080 on both sides no --allow-host flag
    # is needed.
    ports:
      - 127.0.0.1:8080:8080
    # Reach services on the host (a local n8n, the lab stacks) as
    # host.docker.internal. Built in on Docker Desktop; this line adds it on Linux.
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Compose-level (not in the Dockerfile) so one-shot CLI runs of the image
    # are not marked unhealthy. The image has no curl; /api/meta has no side effects.
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/meta', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

    # Kubernetes (opt-in): uncomment to give kubectl your kubeconfig, read-only.
    # Does not work for clusters whose server address is 127.0.0.1 or localhost
    # (kind, minikube, Docker Desktop) - see docker/README.md.
    # create_host_path: false makes a missing kubeconfig an error instead of
    # letting Docker create a root-owned directory in its place.
    # environment:
    #   KUBECONFIG: /kube/config
    # volumes:
    #   - type: bind
    #     source: ${HOME}/.kube/config
    #     target: /kube/config
    #     read_only: true
    #     bind:
    #       create_host_path: false
    # Linux only: ~/.kube/config is normally mode 600, so the container must run
    # as you to read it. Replace with the output of `id -u` and `id -g`.
    # user: "1000:1000"
